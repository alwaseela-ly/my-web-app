name: Build Desktop EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Nativefier
      run: npm install -g nativefier

    - name: Build EXE App
      run: nativefier "https://alwaseela-ly.github.io/my-web-app/" --name "boqrain-pos" --width 1280 --height 800 --disable-context-isolation --disable-web-security --single-instance

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: boqrain-pos-windows
        path: boqrain-pos-win32-x64/
