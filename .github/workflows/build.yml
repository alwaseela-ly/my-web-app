name: Build Desktop EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Create Package File
      shell: cmd
      run: |
        echo {"name": "boqrain-pos", "version": "1.0.0", "main": "main.js"} > package.json

    - name: Create Main File
      shell: cmd
      run: |
        (
        echo const { app, BrowserWindow } = require('electron');
        echo function createWindow () {
        echo   const win = new BrowserWindow({ width: 1280, height: 800, autoHideMenuBar: true });
        echo   win.loadURL('https://alwaseela-ly.github.io/my-web-app/');
        echo }
        echo app.whenReady().then(createWindow);
        ) > main.js

    - name: Install Dependencies
      run: |
        npm install electron electron-packer -g
        npm install electron --save-dev

    - name: Package App to EXE
      run: |
        npx electron-packager . boqrain-pos --platform=win32 --arch=x64 --out=dist --overwrite

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v3
      with:
        name: boqrain-pos-windows
        path: dist/boqrain-pos-win32-x64/
