name: Build Desktop EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Prepare Package File
      shell: bash
      run: |
        cat << 'EOF' > package.json
        {
          "name": "boqrain-pos",
          "version": "1.0.0",
          "main": "main.js",
          "scripts": {
            "start": "electron ."
          }
        }
        EOF

    - name: Prepare Main Electron Script
      shell: bash
      run: |
        cat << 'EOF' > main.js
        const { app, BrowserWindow } = require('electron');
        const path = require('path');

        function createWindow () {
          const win = new BrowserWindow({
            width: 1280,
            height: 800,
            autoHideMenuBar: true,
            webPreferences: {
              nodeIntegration: true,
              contextIsolation: false,
              webSecurity: false
            }
          });

          win.loadFile('index.html');
        }

        app.whenReady().then(createWindow);

        app.on('window-all-closed', () => {
          if (process.platform !== 'darwin') app.quit();
        });
        EOF

    - name: Install Dependencies
      run: |
        npm install electron --save-dev
        npm install -g electron-packager

    - name: Package App to EXE
      run: |
        npx electron-packager . boqrain-pos --platform=win32 --arch=x64 --out=dist --overwrite

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: boqrain-pos-windows
        path: dist/boqrain-pos-win32-x64/
