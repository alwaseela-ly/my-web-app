<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منظومة المبيعات</title>
<style>
:root{--p:#0d5c4b;--p2:#08402f;--bg:#f1f5f3;--c:#fff;--t:#15231f;--m:#66766f;--b:#dde5e1;--r:#c8402f;--a:#f0a81a;--sh:0 2px 12px #0a3d3015}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15px 'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t)}
button,input,select{font:inherit}
input,select{padding:9px 11px;border:1px solid var(--b);border-radius:10px;background:#fff;color:var(--t);max-width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--a);outline-offset:1px}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 15px;background:var(--p);color:#fff;transition:background .15s,transform .1s}
button:hover{background:var(--p2)}button:active{transform:scale(.97)}
button.g{background:#e3eae7;color:var(--t)}button.g:hover{background:#d2dcd8}button.d{background:var(--r)}
button.big{width:100%;padding:15px;font-size:18px;margin-top:12px;background:linear-gradient(135deg,#f5b52e,#e8a317);color:#15231f;font-weight:700;box-shadow:0 4px 12px #e8a31744}
.mu{color:var(--m)}small{color:var(--m);display:block}
#login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#1b8a72,transparent 45%),linear-gradient(135deg,#0d5c4b,#08302a)}
#login form{background:#fff;padding:34px 30px;border-radius:20px;width:min(380px,92vw);display:grid;gap:12px;text-align:center;box-shadow:0 20px 60px #0006}
#login h1{margin:0;color:var(--p);font-size:26px}#login p{margin:0}.lgo{font-size:46px}#lerr{color:var(--r);min-height:20px}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;flex-wrap:wrap;box-shadow:0 2px 12px #0004;position:sticky;top:0;z-index:4}
header b{font-size:19px}#nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
#nav button{background:#ffffff1c;padding:8px 13px}#nav button:hover{background:#ffffff33}#nav button.on{background:#fff;color:var(--p);font-weight:700}
main{padding:18px;max-width:1350px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.card h3{margin:0 0 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row h3{margin:0;flex:1}
.sr{width:100%;padding:12px 14px;font-size:16px}
.pos{display:grid;grid-template-columns:1fr 410px;gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.pc{background:linear-gradient(#fff,#f6faf8);border:1px solid var(--b);border-radius:14px;padding:13px;cursor:pointer;display:grid;gap:5px;transition:transform .12s,box-shadow .12s}
.pc:hover{border-color:var(--p);transform:translateY(-2px);box-shadow:var(--sh)}.pc.out{opacity:.45}.pc span{color:var(--p);font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button.g.on{background:var(--p);color:#fff}
.ln{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--b)}
.qt{display:flex;gap:4px;align-items:center}.qt input{width:58px;text-align:center}.qt button,.ln>button{padding:6px 10px}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.tt{display:flex;justify-content:space-between;font-size:22px;margin-top:14px;font-weight:700;color:var(--p)}
label{display:block;margin:10px 0 4px;color:var(--m)}#cart input:not([type=checkbox]){width:100%}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--b);text-align:right;vertical-align:middle}
th{color:var(--m);font-weight:600;background:#f6faf8}tbody tr:hover,tr:hover td{background:#f8fbfa}td input{width:100%;min-width:70px}.tw{overflow-x:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.kp div{background:#fff;border:1px solid var(--b);border-right:4px solid var(--p);border-radius:12px;padding:12px;box-shadow:var(--sh)}.kp b{font-size:18px;display:block;margin-top:4px}
.kp .hl{background:var(--p);color:#fff}
.low{color:var(--r);font-weight:700}
#pbar{position:fixed;bottom:18px;left:18px;background:#15231f;color:#fff;padding:12px 14px;border-radius:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px #0006;z-index:8;animation:up .3s}
@keyframes up{from{transform:translateY(16px);opacity:0}}
#modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:9}
.mb{background:#fff;border-radius:16px;padding:20px;width:min(440px,92vw);display:grid;gap:10px}.ln2{display:flex;justify-content:space-between;gap:8px;align-items:center}.ln2 input{width:80px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#15231f;color:#fff;padding:11px 20px;border-radius:10px;z-index:10;box-shadow:0 6px 20px #0005}
#prt{display:none;color:#000}
.inv{font-family:'Segoe UI',Tahoma,Arial,sans-serif}.inv .lg{max-height:70px;max-width:120px}
.inv h1{margin:0 0 4px;color:#0d5c4b;font-size:24px}.inv table{width:100%;border-collapse:collapse}
.inv .mt{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin:10px 0}
.inv .tot{margin-top:12px;width:270px;margin-inline-start:auto}.inv .tot div{display:flex;justify-content:space-between;padding:4px 0}
.inv .tot .gt{font-size:18px;font-weight:700;border-top:2px solid #0d5c4b;margin-top:4px;padding-top:8px}
.inv .ft{text-align:center;margin-top:26px;color:#555}
.inv.a4 .ih{display:flex;align-items:center;gap:16px;border-bottom:3px solid #0d5c4b;padding-bottom:12px}
.inv.a4 th{background:#0d5c4b;color:#fff;padding:9px;text-align:right}.inv.a4 td{padding:9px;border-bottom:1px solid #ddd}
.inv.th{width:76mm;font-size:12px}.inv.th .ih{text-align:center;border-bottom:1px dashed #000;padding-bottom:6px}.inv.th h1{font-size:16px;color:#000}
.inv.th .mt{grid-template-columns:1fr}.inv.th .tot{width:100%}.inv.th th,.inv.th td{padding:2px;border-bottom:1px dashed #000;text-align:right;background:none;color:#000}
.bcw{text-align:center;margin-top:16px}.bcw svg{display:inline-block}.lbs{display:flex;flex-wrap:wrap;gap:6px}.lb{width:50mm;border:1px dashed #999;padding:3px;text-align:center;font-size:11px;break-inside:avoid}
.pg{break-after:page;page-break-after:always}.pg:last-child{break-after:auto;page-break-after:auto}
#lic{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#1b8a72,transparent 45%),linear-gradient(135deg,#0d5c4b,#08302a)}
.lc{background:#fff;padding:34px 30px;border-radius:20px;width:min(400px,92vw);display:grid;gap:12px;text-align:center;box-shadow:0 20px 60px #0006}.lc h2{margin:0;color:var(--p)}.lc p{margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}.chips button{white-space:nowrap;background:#e3eae7;color:var(--t);border-radius:20px}.chips button.on{background:var(--p);color:#fff}
.cg{display:inline-flex;gap:4px;align-items:center;background:#eef3f1;border-radius:20px;padding:3px 6px 3px 12px}.cg button{padding:3px 8px;border-radius:50%}
@media(max-width:900px){.pos{grid-template-columns:1fr}}
@media print{body>*{display:none!important}#prt{display:block!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="login">
 <form onsubmit="login();return false">
  <div class="lgo">🏪</div><h1>منظومة المبيعات</h1><p class="mu">سجّل الدخول للمتابعة</p>
  <select id="lu"><option value="admin">المدير</option><option value="cashier">الكاشير</option></select>
  <input id="lp" type="password" placeholder="كلمة المرور" autocomplete="off">
  <p id="lerr"></p><small id="lh"></small><button type="submit">تسجيل الدخول</button>
 </form>
</div>
<div id="app" hidden>
 <header><b id="sn"></b><div id="nav"></div><button id="snd" onclick="sendNow()">📤 إرسال التقرير الآن</button><span id="who"></span><button class="g" onclick="logout()">تسجيل الخروج</button></header>
 <main id="main"></main>
</div>
<div id="lic"><div class="lc"><div class="lgo">🔑</div><h2 id="lt">⏳ جارٍ تحميل البيانات...</h2><p id="lm" class="mu"></p><div id="lb" style="display:grid;gap:10px"></div><p id="le" style="color:var(--r);min-height:20px"></p></div></div>
<div id="pbar" hidden></div><div id="modal" hidden></div><div id="prt"></div><div id="toast" hidden></div>
<style id="pgs"></style>
<script>
'use strict';
const $=s=>document.querySelector(s),M=$('#main');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{v=parseFloat(v);return isFinite(v)?v:0};
const H=s=>{s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();let a=0xdeadbeef,b=0x41c6ce57;for(const ch of String(s)){const c=ch.charCodeAt(0);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
 a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);return 'h'+(a>>>0).toString(36)+(b>>>0).toString(36)};
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const ML={cash:'نقداً',transfer:'تحويل مصرفي',debt:'دين'};
const KEY='salesSystem_v1';
let db,user=null,tab='pos',ci=0,q='',sk='',rd=dk(new Date()),tt;

function newCart(){return{items:[],cust:'',disc:0,method:'cash'}}
function load(d){
 if(d===undefined){try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){d=null}}db=d;
 if(!db||typeof db!=='object')db={};
 db.users=db.users||{admin:H('1234'),cashier:H('0000')};
 db.products=db.products||[];db.returns=db.returns||[];db.expenses=db.expenses||[];db.pays=db.pays||[];db.sales=db.sales||[];db.purchases=db.purchases||[];db.seq=db.seq||1;db.codeSeq=db.codeSeq||0;db.logs=db.logs||[];db.cats=db.cats||[];db.products.forEach(p=>{if(p.cat&&!db.cats.includes(p.cat))db.cats.push(p.cat)});
 let mx=Math.max(0,...db.sales.map(x=>x.no||0));db.sales.filter(x=>!x.no).sort((a,b)=>a.id-b.id).forEach(x=>{x.no=++mx});db.invSeq=Math.max(db.invSeq||0,mx);
 db.set=Object.assign({store:'متجري',cur:'ر.س',tok:'',chat:'',auto:false,notify:false,time:'21:00',last:'',phone:'',addr:'',tax:'',hdr:'',ftr:'شكراً لتعاملكم معنا',logo:'',nl:false},db.set||{});
 db.set.cperm=Object.assign({pos:1,stock:1,ret:1,inv:1,buy:0,exp:0,cus:0,rep:0,send:1},db.set.cperm||{});
 if(!db.carts||!db.carts.length)db.carts=[newCart()];
}

function toast(s){const t=$('#toast');t.textContent=s;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}
const m=v=>(+v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+db.set.cur;
const cart=()=>db.carts[ci]||(ci=0,db.carts[0]);
const subOf=c=>c.items.reduce((a,i)=>a+i.price*i.q,0);

/* ---------- الباركود وأرقام الفواتير ---------- */
const dig=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const fn=x=>String(x.no||x.id).padStart(4,'0');
const sn=id=>{const x=db.sales.find(v=>v.id===id);return x?fn(x):String(id)};
const C128="212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112".split(' ');
function bcSVG(t,k=.32,h=12){
 t=dig(t);const v=[104];let c0=104;
 for(const ch of t){const c=ch.charCodeAt(0)-32;if(c<0||c>94)continue;v.push(c);c0+=c*(v.length-1)}
 v.push(c0%103,106);let x=10,r='';
 v.forEach(c=>{const w=C128[c];for(let i=0;i<w.length;i++){const u=+w[i];if(i%2===0)r+=`<rect x="${x}" width="${u}" height="40"/>`;x+=u}});
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+10} 40" preserveAspectRatio="none" style="width:${((x+10)*k).toFixed(1)}mm;height:${h}mm;background:#fff" shape-rendering="crispEdges" role="img" aria-label="${esc(t)}"><g fill="#000">${r}</g></svg>`}
function genCode(){let c;do{c='2'+String(++db.codeSeq).padStart(7,'0')}while(db.products.some(p=>p.code===c));return c}

/* ---------- التخزين: IndexedDB (الأساسي) + ملف على القرص في نسخة سطح المكتب ---------- */
const BIG=['sales','purchases','returns','expenses','pays','logs'],CH=500;
let idb=null,wt=null,dw=null,cache={},fail=0;
function idbInit(){return new Promise(res=>{try{const r=indexedDB.open('SalesSystemDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{idb=r.result;res(true)};r.onerror=r.onblocked=()=>res(false)}catch(e){res(false)}})}
function idbGet(k){return new Promise(res=>{if(!idb)return res(undefined);try{const r=idb.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)}catch(e){res(undefined)}})}
function idbPut(o){return new Promise((res,rej)=>{if(!idb)return res();try{const t=idb.transaction('kv','readwrite'),st=t.objectStore('kv');for(const k in o){if(o[k]===undefined)st.delete(k);else st.put(o[k],k)}t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error)}catch(e){rej(e)}})}
function snapshot(){
 const core={};for(const k in db)if(!BIG.includes(k))core[k]=db[k];
 const o={core:JSON.stringify(core)};
 BIG.forEach(k=>{const a=db[k]||[],c=Math.ceil(a.length/CH);o[k+':n']=String(c);for(let i=0;i<c;i++)o[k+':'+i]=JSON.stringify(a.slice(i*CH,(i+1)*CH))});
 return o}
async function flushNow(){
 clearTimeout(wt);wt=null;if(!db)return;
 try{
  const sn=snapshot(),w={};
  for(const k in sn)if(cache[k]!==sn[k])w[k]=sn[k];
  for(const k in cache)if(!(k in sn))w[k]=undefined;
  if(idb){if(Object.keys(w).length)await idbPut(w)}else localStorage.setItem(KEY,JSON.stringify(db));
  for(const k in w){if(w[k]===undefined)delete cache[k];else cache[k]=w[k]}
  fail=0;mirror()
 }catch(e){if(!fail++)toast('تعذر حفظ البيانات — صدّر نسخة احتياطية الآن')}}
function save(){if(!wt)wt=setTimeout(flushNow,300)}
function mirror(){if(!window.desktop)return;clearTimeout(dw);dw=setTimeout(()=>{try{window.desktop.dbSave(JSON.stringify(db))}catch(e){}},8000)}
async function idbLoadDb(){
 if(!idb)return null;const c=await idbGet('core');if(!c)return null;
 const d=JSON.parse(c);cache.core=c;
 for(const k of BIG){const c2=+(await idbGet(k+':n'))||0;d[k]=[];cache[k+':n']=String(c2);
  for(let i=0;i<c2;i++){const t=await idbGet(k+':'+i);cache[k+':'+i]=t;d[k].push(...JSON.parse(t))}}
 return d}
async function wipeStore(){
 clearTimeout(wt);wt=null;const w={};Object.keys(cache).forEach(k=>w[k]=undefined);cache={};
 try{await idbPut(w)}catch(e){}
 if(window.desktop){try{await window.desktop.dbWipe()}catch(e){}}}
async function stgInfo(){
 const b=$('#stg');if(!b)return;let t='—',x='';
 try{const e=await navigator.storage.estimate();t='المساحة المستخدمة: <b>'+(e.usage/1048576).toFixed(1)+' MB</b> من المتاح تقريباً <b>'+(e.quota/1073741824).toFixed(1)+' GB</b>'}catch(e){}
 if(window.desktop){try{const i=await window.desktop.info();x='<br>مجلد البيانات على الجهاز: <span dir="ltr">'+esc(i.dataPath)+'</span><br>نسخة الملف على القرص: '+(i.mirror?'موجودة ✅':'ستُنشأ تلقائياً بعد أول عملية حفظ')}catch(e){}}
 b.innerHTML=t+x+'<br>الفواتير: '+db.sales.length+' — المنتجات: '+db.products.length}
async function boot(){
 try{await idbInit();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 await licLoad();
 let d=null;
 try{d=await idbLoadDb()}catch(e){d=null}
 if(!d&&window.desktop){try{const t=await window.desktop.dbLoad();if(t)d=JSON.parse(t)}catch(e){}}
 if(!d){try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){d=null}}
 load(d||null);await flushNow();
 if(idb&&!fail){try{localStorage.removeItem(KEY)}catch(e){}}
 logEv('app');hint();if(licCheck())licTouch();
 setInterval(()=>{if(licCheck())licTouch()},4000);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)flushNow()});
 window.addEventListener('beforeunload',()=>{if(window.desktop&&db){try{window.desktop.dbSaveSync(JSON.stringify(db))}catch(e){}}flushNow()});
 document.addEventListener('keydown',e=>{
  if(tab!=='pos'||!user||e.ctrlKey||e.altKey||e.metaKey||e.key.length!==1||!$('#modal').hidden)return;
  if(/INPUT|SELECT|TEXTAREA/.test((document.activeElement&&document.activeElement.tagName)||''))return;
  const f=$('#srch');if(f)f.focus()})}

function sha(str){

 if(L.used&&L.used[h])return err('هذا الكود مستخدم من قبل');
 if(L.seen&&now<L.seen-3e5)return err('ساعة الجهاز غير صحيحة');
 L.exp=Math.max(now,L.exp||0)+PL[pl][1];L.plan=pl;L.seen=Math.max(now,L.seen||0);(L.used=L.used||{})[h]={at:now,pl};lset(L);
 if(src==='s'){toast('تم تفعيل الكارت: '+PL[pl][0]);return vSet()}

 $('#lm').innerHTML='نوع الكارت: <b>'+PL[pl][0]+'</b><br>ينتهي في: '+esc(fmtDT(L.exp));

 <div class="card"><h3>💹 تعديل الأسعار</h3><small>زيادة أو خفض سعر البيع لكل المنتجات أو لمنتجات محددة، بمبلغ ثابت أو نسبة مئوية. تظهر معاينة قبل التطبيق.</small>
 <div class="row" style="margin-top:8px"><select id="pm1"><option value="1">زيادة</option><option value="-1">خفض</option></select><input id="pv" type="number" min="0" step="0.01" placeholder="القيمة"><select id="pt"><option value="f">مبلغ ثابت</option><option value="p">نسبة %</option></select><select id="ps" onchange="$('#ppl').hidden=this.value!=='sel';$('#pcat').hidden=this.value!=='cat'"><option value="all">كل المنتجات</option><option value="cat">صنف كامل</option><option value="sel">منتجات أحددها</option></select><select id="pcat" hidden>${db.cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>
 <div id="ppl" hidden style="max-height:180px;overflow:auto;margin-top:8px;border:1px solid var(--b);border-radius:10px;padding:6px">${db.products.map(p=>`<label style="display:flex;gap:8px;align-items:center;margin:2px 0;color:var(--t)"><input type="checkbox" style="width:auto" class="pck" value="${p.id}"> ${esc(p.name)} — ${m(p.price)}</label>`).join('')||'<span class="mu">لا توجد منتجات</span>'}</div>
 <button style="margin-top:10px" onclick="pricePrev()">معاينة وتطبيق</button></div>
 <div class="card"><h3>👁 ما يظهر للكاشير</h3><small>ضع علامة ✓ على ما تريد إظهاره له، وأزلها لإخفائه. التغيير يسري عند دخول الكاشير التالي. الإعدادات وسجل الدخول للمدير فقط دائماً.</small>
 <div style="margin-top:8px">${[['pos','🛒 البيع'],['stock','📦 المخزون'],['ret','↩️ المرتجعات'],['inv','🖨 الفواتير'],['buy','📥 المشتريات'],['exp','💸 المصروفات'],['cus','👥 العملاء والديون'],['rep','📊 التقارير'],['send','📤 زر إرسال التقرير الآن']].map(([k,l])=>`<label style="display:inline-flex;gap:6px;align-items:center;margin:6px 0 6px 18px;color:var(--t)"><input type="checkbox" style="width:auto" ${s.cperm[k]||k==='pos'?'checked':''} ${k==='pos'?'disabled':''} onchange="setPerm('${k}',this.checked)"> ${l}</label>`).join('')}</div></div>
 <div class="card"><h3>🔒 تغيير كلمة المرور</h3><div class="row"><select id="pu"><option value="admin">المدير</option><option value="cashier">الكاشير</option></select>
 <input id="pa" type="password" placeholder="كلمة مرور المدير الحالية"><input id="pn" type="password" placeholder="الكلمة الجديدة"><input id="pn2" type="password" placeholder="تأكيد الكلمة الجديدة"><button onclick="chPw()">تغيير</button></div></div>
 <div class="card"><h3>💾 نسخة احتياطية</h3><div class="row"><button onclick="exp()">تصدير البيانات</button><input type="file" id="imf" accept=".json"><button class="g" onclick="imp()">استيراد</button></div></div>
 <div class="card"><h3>🗑 ضبط المصنع</h3><small>يحذف كل البيانات ويعيد المنظومة كما كانت عند أول تشغيل. يُطلب منك التأكيد قبل التنفيذ.</small><button class="d" style="margin-top:10px" onclick="askReset()">ضبط المصنع</button></div>`}
function saveSt(){
 const a=$('#s1').value.trim();if(!a)return toast('اسم المتجر مطلوب');
 Object.assign(db.set,{store:a,cur:$('#s2').value.trim()||'ر.س',phone:$('#s3').value.trim(),addr:$('#s4').value.trim(),tax:$('#s5').value.trim(),hdr:$('#s6').value.trim(),ftr:$('#s7').value.trim()});
 save();toast('تم الحفظ');$('#sn').textContent=a}
function setLogo(el){
 const f=el.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('اختر ملف صورة');if(f.size>300000)return toast('حجم الشعار كبير (الحد 300KB)');
 const r=new FileReader();r.onload=()=>{saveSt();db.set.logo=r.result;save();toast('تم رفع الشعار');vSet()};r.readAsDataURL(f)}
function saveTg(){const s=db.set;s.tok=$('#t1').value.trim();s.chat=$('#t2').value.trim();s.notify=$('#t3').checked;s.nl=$('#t6').checked;s.auto=$('#t4').checked;s.time=$('#t5').value||'21:00';save();toast('تم حفظ إعدادات تيليجرام')}
async function testTg(){saveTg();const r=await tg('✅ تم ربط منظومة المبيعات — '+db.set.store);toast(r.ok?'وصلت الرسالة':'فشل: '+r.e)}
function setPerm(k,v){db.set.cperm[k]=v?1:0;save();toast('تم حفظ الصلاحيات')}
function chPw(){
 const u=$('#pu').value,a=$('#pa').value,p=$('#pn').value;
 if(db.users.admin!==H(a))return toast('كلمة مرور المدير الحالية غير صحيحة');
 if(p.length<4)return toast('كلمة المرور 4 أحرف على الأقل');if(p!==$('#pn2').value)return toast('كلمتا المرور غير متطابقتين');
 db.users[u]=H(p);save();hint();toast('تم تغيير كلمة المرور');vSet()}
function exp(){
 const b=new Blob([JSON.stringify(db)],{type:'application/json'}),l=document.createElement('a');
 l.href=URL.createObjectURL(b);l.download='sales-backup-'+dk(new Date())+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),1000)}
function imp(){
 const f=$('#imf').files[0];if(!f)return toast('اختر ملف النسخة الاحتياطية');
 const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.products)||!d.users)throw 0;
  if(!confirm('سيتم استبدال كل البيانات الحالية. متابعة؟'))return;load(d);save();ci=0;toast('تم استيراد النسخة الاحتياطية');nav()}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}

const BOOT=boot();
</script>
</body>
</html>
