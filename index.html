.btn-icon{width:42px;height:42px;padding:0;display:inline-grid;place-items:center;border-radius:13px;font-size:18px}.section-title{display:flex;align-items:center;gap:10px}.section-title:before{content:'';width:4px;height:24px;border-radius:9px;background:linear-gradient(var(--a),var(--p));display:inline-block}.invoice-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;align-items:end;margin-top:12px;padding:14px;border:1px solid #d8e9e1;border-radius:15px;background:linear-gradient(135deg,#f8fcfa,#eef8f3)}.invoice-tools label{margin:0}.invoice-tools input,.invoice-tools select{width:100%;margin-top:5px}.brand-preview{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px dashed #b9d8ca;border-radius:14px;background:#fbfffd}.brand-preview img{max-width:110px;max-height:60px;object-fit:contain}.hint-pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:99px;background:#e7f5ee;color:var(--p);font-size:12px;font-weight:700}.transfer-box{box-shadow:inset 0 0 0 1px #e2f2eb}.transfer-box input{font-size:18px;font-weight:800;text-align:center}.inv.align-center .ih{text-align:center;justify-content:center}.inv.align-right .ih{text-align:right;justify-content:flex-start}.inv.align-left .ih{text-align:left;justify-content:flex-start;direction:ltr}.inv.align-center .mt{text-align:center}.inv.align-left .mt{text-align:left;direction:ltr}.inv.align-center table th,.inv.align-center table td{text-align:center}.inv.align-left table th,.inv.align-left table td{text-align:left}.inv .ih{min-height:78px}.inv .lg{object-fit:contain;border-radius:10px}.inv.font-cairo{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif}.inv.font-tahoma{font-family:Tahoma,'Segoe UI',Arial,sans-serif}.inv.font-arial{font-family:Arial,sans-serif}.inv.font-georgia{font-family:Georgia,'Times New Roman',serif}@media(max-width:900px){.pos{grid-template-columns:1fr}}

/* ---------- تحسينات احترافية للإضافات ---------- */
:root{--p:#116b57;--p2:#073b31;--p3:#dff5ed;--bg:#f4f7f6;--c:#fff;--t:#14221e;--m:#70817b;--b:#dce7e2;--r:#c84336;--a:#f2b544;--sh:0 8px 24px #103d3210;--sh2:0 16px 40px #103d3218;--radius:18px}
body{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;background:radial-gradient(circle at 100% 0,#e7f5ef 0,transparent 28%),var(--bg);letter-spacing:-.1px}header{min-height:72px;gap:14px}.brand{display:flex;align-items:center;gap:10px;min-width:170px}.brand img{width:42px;height:42px;object-fit:contain;border-radius:12px;background:#ffffff1a;padding:4px}.brand img[hidden]{display:none!important}#sn{white-space:nowrap}.card h3{font-weight:800;letter-spacing:-.3px}.row{row-gap:10px}.pc{font-family:'Noto Sans Arabic','Segoe UI',sans-serif}.pc b{font-size:16px}.tabs button,.pm button{min-height:42px}.inv.font-noto{font-family:'Noto Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif}.inv.font-kufi{font-family:'Noto Kufi Arabic','Noto Sans Arabic',Tahoma,Arial,sans-serif}.inv.font-naskh{font-family:'Noto Naskh Arabic','Noto Sans Arabic',serif}.inv.font-amiri{font-family:'Amiri','Noto Naskh Arabic',serif;font-size:16px}.inv.font-scheherazade{font-family:'Scheherazade','Noto Naskh Arabic',serif;font-size:17px}
#wc{display:none!important}button{border-radius:12px;font-weight:600;box-shadow:0 2px 5px #0d5c4b14}button:hover{box-shadow:0 5px 12px #0d5c4b22}button.g{background:#edf3f0;border:1px solid #d8e5df}main{max-width:1450px;padding:24px}.card{border-radius:var(--radius);box-shadow:var(--sh);border-color:#e1ebe7;padding:20px}.card:hover{box-shadow:var(--sh2)}.pc{border-radius:16px;padding:16px;background:linear-gradient(145deg,#fff,#f5fbf8);border-color:#deebe5;min-height:104px}.sr{border-radius:14px;border:2px solid #d9e8e1;background:#fbfefd;padding:14px 16px}.kp{gap:14px}.kp div{border-radius:16px;padding:16px;min-height:82px}.kp b{font-size:21px}table{border-spacing:0 4px}th{background:#f1f7f4;padding:12px}td{padding:12px}tbody tr{transition:transform .12s,box-shadow .12s}tbody tr:hover{box-shadow:0 3px 12px #103d3210;transform:translateY(-1px)}
.transfer-box{margin-top:10px;padding:12px;border:1px solid #cfe5dc;border-radius:14px;background:#f2faf6}.transfer-box label{margin:0;color:var(--t);font-weight:700}.transfer-box input{width:140px!important}.cost-warn{border-color:#d34a3c!important;background:#fff1ef!important;color:#a62e23!important;box-shadow:0 0 0 2px #d34a3c22}.preview-modal{width:min(900px,96vw);max-height:90vh;overflow:auto}.preview-paper{background:#fff;color:#111;padding:24px;border:1px solid #d9e3df;border-radius:12px}.preview-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bar-row{display:grid;grid-template-columns:minmax(90px,1fr) 3fr auto;gap:8px;align-items:center;margin:9px 0;font-size:12px}.bar-track{height:10px;border-radius:99px;background:#e6efeb;overflow:hidden}.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#159575,#f0b23b)}.smart-note{padding:12px 14px;border-radius:12px;background:#f6faf8;border:1px solid var(--b);color:var(--m)}
@media(max-width:800px){.chart-grid{grid-template-columns:1fr}}@media(max-width:600px){main{padding:12px}.card{padding:14px}}

<div id="login">
 <form onsubmit="login();return false">
  <div class="lgo">🏪</div><h1>منظومة المبيعات</h1><p class="mu">سجّل الدخول للمتابعة</p>

<script>
'use strict';
const $=s=>document.querySelector(s),M=$('#main');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{v=parseFloat(v);return isFinite(v)?v:0};
const H=s=>{s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();let a=0xdeadbeef,b=0x41c6ce57;for(const ch of String(s)){const c=ch.charCodeAt(0);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
 a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);return 'h'+(a>>>0).toString(36)+(b>>>0).toString(36)};
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const ML={cash:'نقداً',transfer:'تحويل مصرفي',debt:'دين'};
const KEY='salesSystem_v1';
let db,user=null,tab='pos',ci=0,q='',sk='',rd=dk(new Date()),tt;

function newCart(){const s=db&&db.set||{};return{items:[],cust:'',disc:0,method:'cash',transferPct:s.transferMode==='percent'?Math.min(100,Math.max(0,n(s.transferValue))):0}}
function load(d){FULLSNAP=true;
 if(d===undefined){try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){d=null}}db=d;
 if(!db||typeof db!=='object')db={};
 db.users=db.users||{admin:H('1234'),cashier:H('0000')};
 db.products=db.products||[];db.returns=db.returns||[];db.expenses=db.expenses||[];db.pays=db.pays||[];db.sales=db.sales||[];db.purchases=db.purchases||[];db.seq=db.seq||1;db.codeSeq=db.codeSeq||0;db.logs=db.logs||[];db.cats=db.cats||[];db.supplierInvoices=db.supplierInvoices||[];db.products.forEach(p=>{if(p.cat&&!db.cats.includes(p.cat))db.cats.push(p.cat)});
 let mx=Math.max(0,...db.sales.map(x=>x.no||0));db.sales.filter(x=>!x.no).sort((a,b)=>a.id-b.id).forEach(x=>{x.no=++mx});db.invSeq=Math.max(db.invSeq||0,mx);
 db.set=Object.assign({store:'متجري',cur:'ر.س',tok:'',chat:'',auto:false,notify:false,time:'21:00',last:'',phone:'',addr:'',tax:'',hdr:'',ftr:'شكراً لتعاملكم معنا',logo:'',nl:false,transferMode:'none',transferValue:0,custom1:'',custom2:''},db.set||{});
 db.set.cperm=Object.assign({pos:1,stock:1,ret:1,inv:1,buy:0,exp:0,cus:0,rep:0,send:1},db.set.cperm||{});
 if(!db.carts||!db.carts.length)db.carts=[newCart()];
}

function toast(s){const t=$('#toast');t.textContent=s;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}
const m=v=>(+v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+db.set.cur;
const cart=()=>db.carts[ci]||(ci=0,db.carts[0]);
const subOf=c=>c.items.reduce((a,i)=>a+i.price*i.q,0);
function transferFee(c,base){if(c.method!=='transfer')return 0;if(c.transferPct!==undefined){const pct=Math.min(100,Math.max(0,n(c.transferPct)));return Math.round(base*pct/100*100)/100}const s=db.set||{};return s.transferMode==='percent'?Math.round(base*Math.max(0,n(s.transferValue))/100*100)/100:s.transferMode==='fixed'?Math.max(0,n(s.transferValue)):0}
function costWarning(p){if(p&&n(p.cost)>n(p.price))toast('⚠️ تحذير: سعر التكلفة أعلى من سعر البيع — يمكنك المتابعة بعد المراجعة')}
function csvCell(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
function downloadCSV(name,rows){const text='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportSalesCSV(list,name='sales-report'){downloadCSV(name,[['رقم الفاتورة','التاريخ','العميل','طريقة الدفع','الإجمالي','المرتجع'],...list.map(x=>[fn(x),new Date(x.date).toLocaleString('ar'),x.cust||'عميل نقدي',ML[x.method],x.total,x.ret||0])])}
function exportDebtsCSV(){const b=bal();downloadCSV('debts-report',[['العميل','الرصيد المستحق'],...Object.entries(b).filter(([,v])=>Math.abs(v)>.005).map(([k,v])=>[k,v])])}

function stats(k){
 const S=db.sales.filter(x=>dk(x.date)===k),P=db.purchases.filter(x=>dk(x.date)===k),R=db.returns.filter(x=>dk(x.date)===k),E=db.expenses.filter(x=>dk(x.date)===k);

 return{bc,S,n:S.length,cash:by('cash'),tr:by('transfer'),debt:by('debt'),total:by('cash')+by('transfer')+by('debt'),ret:sum(R,x=>x.total),profit,exp,net:profit-exp,buy:sum(P,x=>x.total)}}

 const x=db.sales.find(v=>v.id===id);if(!x)return;let tot=0,pf=0;const L=[];
 x.items.forEach((i,k)=>{const v=Math.min(Math.max(0,Math.floor(n($('#rt'+k).value))),i.q-(i.r||0));

 if(!L.length)return toast('حدد كمية للإرجاع');

 db.returns.push({id:db.seq++,by:user,date:new Date().toISOString(),sale:id,method:x.method,cust:x.cust,total:refund,profit:pf-tot*sh,items:L});

 const t=new Date(),d0=new Date(t.getFullYear(),t.getMonth(),t.getDate());let a=d0,b=new Date(t.getTime()+6e4);

/* ---------- تعديل الأسعار ---------- */
let PP=[];
function priceCalc(){
 const sg=+$('#pm1').value,v=Math.abs(n($('#pv').value)),t=$('#pt').value,sel=$('#ps').value==='sel';
 if(v<=0){toast('أدخل قيمة أكبر من صفر');return null}
 const md=$('#ps').value,ids=md==='sel'?[...document.querySelectorAll('.pck:checked')].map(e=>+e.value):md==='cat'?db.products.filter(p=>p.cat===$('#pcat').value).map(p=>p.id):db.products.map(p=>p.id);
 if(!ids.length){toast('اختر منتجاً واحداً على الأقل');return null}
 return db.products.filter(p=>ids.includes(p.id)).map(p=>({p,np:Math.max(0,Math.round((t==='p'?p.price*(1+sg*v/100):p.price+sg*v)*100)/100)}))}
function pricePrev(){
 const l=priceCalc();if(!l)return;PP=l;
 $('#modal').innerHTML=`<div class="mb"><h3>معاينة تعديل الأسعار</h3><p style="margin:0">سيتم تعديل سعر البيع لـ ${l.length} منتج:</p><div class="tw" style="max-height:220px;overflow:auto"><table><tr><th>المنتج</th><th>القديم</th><th>الجديد</th></tr>${l.slice(0,30).map(({p,np})=>`<tr><td>${esc(p.name)}</td><td>${m(p.price)}</td><td><b>${m(np)}</b></td></tr>`).join('')}</table></div>${l.length>30?'<small>وباقي المنتجات بنفس الطريقة.</small>':''}<div class="row"><button onclick="priceApply()">تطبيق</button><button class="g" onclick="closeM()">إلغاء</button></div></div>`;$('#modal').hidden=false}
function priceApply(){
 const c=PP.length;PP.forEach(({p,np})=>{p.price=np;db.carts.forEach(k=>k.items.forEach(i=>{if(i.id===p.id)i.price=np}))});
 PP=[];save();closeM();toast('تم تعديل أسعار '+c+' منتج');vSet()}

/* ---------- تيليجرام ---------- */
async function tg(text){
 const s=db.set;if(!s.tok||!s.chat)return{ok:false,e:'أدخل التوكن ومعرّف الدردشة من الإعدادات'};
 try{
  const r=await fetch('https://api.telegram.org/bot'+encodeURIComponent(s.tok.trim())+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({chat_id:s.chat.trim(),text})});
  const j=await r.json();return j.ok?{ok:true}:{ok:false,e:j.description||'خطأ غير معروف'}
 }catch(e){return{ok:false,e:'تعذر الاتصال بالإنترنت'}}}
setInterval(()=>{
 const s=db.set;if(!s||!s.auto||!s.tok)return;const d=new Date(),k=dk(d),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 if(hm>=s.time&&s.last!==k){s.last=k;save();tg(reportText(k)).then(r=>{if(!r.ok){s.last='';save()}})}},30000);

 <div class="card"><h3>🔑 الاشتراك والتفعيل</h3><small>أدخل كود العميل هنا. سيظهر نوع الاشتراك تلقائيًا: أسبوع، شهر أو سنة، وتُضاف مدته إلى المدة المتبقية.</small><div style="margin-top:8px">${licInfo()}</div><div class="row" style="margin-top:10px"><input id="lk2" dir="ltr" placeholder="كود كارت جديد (يُضاف إلى المدة المتبقية)"><button onclick="licAct('s')">إضافة كارت</button></div></div>
 <div class="card"><h3>💹 تعديل الأسعار</h3><small>زيادة أو خفض سعر البيع لكل المنتجات أو لمنتجات محددة، بمبلغ ثابت أو نسبة مئوية. تظهر معاينة قبل التطبيق.</small>
 <div class="row" style="margin-top:8px"><select id="pm1"><option value="1">زيادة</option><option value="-1">خفض</option></select><input id="pv" type="number" min="0" step="0.01" placeholder="القيمة"><select id="pt"><option value="f">مبلغ ثابت</option><option value="p">نسبة %</option></select><select id="ps" onchange="$('#ppl').hidden=this.value!=='sel';$('#pcat').hidden=this.value!=='cat'"><option value="all">كل المنتجات</option><option value="cat">صنف كامل</option><option value="sel">منتجات أحددها</option></select><select id="pcat" hidden>${db.cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>
 <div id="ppl" hidden style="max-height:180px;overflow:auto;margin-top:8px;border:1px solid var(--b);border-radius:10px;padding:6px">${db.products.map(p=>`<label style="display:flex;gap:8px;align-items:center;margin:2px 0;color:var(--t)"><input type="checkbox" style="width:auto" class="pck" value="${p.id}"> ${esc(p.name)} — ${m(p.price)}</label>`).join('')||'<span class="mu">لا توجد منتجات</span>'}</div>
 <button style="margin-top:10px" onclick="pricePrev()">معاينة وتطبيق</button></div>
 <div class="card"><h3>👁 ما يظهر للكاشير</h3><small>ضع علامة ✓ على ما تريد إظهاره له، وأزلها لإخفائه. التغيير يسري عند دخول الكاشير التالي. الإعدادات وسجل الدخول للمدير فقط دائماً.</small>
 <div style="margin-top:8px">${[['pos','🛒 البيع'],['stock','📦 المخزون'],['ret','↩️ المرتجعات'],['inv','🖨 الفواتير'],['buy','📥 المشتريات'],['exp','💸 المصروفات'],['cus','👥 العملاء والديون'],['rep','📊 التقارير'],['send','📤 زر إرسال التقرير الآن']].map(([k,l])=>`<label style="display:inline-flex;gap:6px;align-items:center;margin:6px 0 6px 18px;color:var(--t)"><input type="checkbox" style="width:auto" ${s.cperm[k]||k==='pos'?'checked':''} ${k==='pos'?'disabled':''} onchange="setPerm('${k}',this.checked)"> ${l}</label>`).join('')}</div></div>
 <div class="card"><h3>🔒 تغيير كلمة المرور</h3><div class="row"><select id="pu"><option value="admin">المدير</option><option value="cashier">الكاشير</option></select>
 <input id="pa" type="password" placeholder="كلمة مرور المدير الحالية"><input id="pn" type="password" placeholder="الكلمة الجديدة"><input id="pn2" type="password" placeholder="تأكيد الكلمة الجديدة"><button onclick="chPw()">تغيير</button></div></div>
 <div class="card"><h3>💾 نسخة احتياطية</h3><div class="row"><button onclick="exp()">تصدير البيانات</button><input type="file" id="imf" accept=".json"><button class="g" onclick="imp()">استيراد</button></div></div>
 <div class="card"><h3>🗑 ضبط المصنع</h3><small>يحذف كل البيانات ويعيد المنظومة كما كانت عند أول تشغيل. يُطلب منك التأكيد قبل التنفيذ.</small><button class="d" style="margin-top:10px" onclick="askReset()">ضبط المصنع</button></div>`}
function saveSt(){
 const a=$('#s1').value.trim();if(!a)return toast('اسم المتجر مطلوب');
 Object.assign(db.set,{store:a,cur:$('#s2').value.trim()||'ر.س',phone:$('#s3').value.trim(),addr:$('#s4').value.trim(),tax:$('#s5').value.trim(),hdr:$('#s6').value.trim(),custom1:$('#s8').value.trim(),custom2:$('#s9').value.trim(),ftr:$('#s7').value.trim(),transferMode:$('#tfm').value,transferValue:$('#tfm').value==='percent'?Math.min(100,Math.max(0,n($('#tfv').value))):Math.max(0,n($('#tfv').value)),invoiceFont:$('#ifont').value,invoiceAlign:$('#ialign').value});
 db.carts.forEach(c=>{if(!c.items.length)c.transferPct=db.set.transferMode==='percent'?db.set.transferValue:0});
 save();toast('تم الحفظ');$('#sn').textContent=a}
function setLogo(el){
 const f=el.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('اختر ملف صورة');if(f.size>300000)return toast('حجم الشعار كبير (الحد 300KB)');
 const r=new FileReader();r.onload=()=>{saveSt();db.set.logo=r.result;save();toast('تم رفع الشعار');vSet()};r.readAsDataURL(f)}
function saveTg(){const s=db.set;s.tok=$('#t1').value.trim();s.chat=$('#t2').value.trim();s.notify=$('#t3').checked;s.nl=$('#t6').checked;s.auto=$('#t4').checked;s.time=$('#t5').value||'21:00';save();toast('تم حفظ إعدادات تيليجرام')}
async function testTg(){saveTg();const r=await tg('✅ تم ربط منظومة المبيعات — '+db.set.store);toast(r.ok?'وصلت الرسالة':'فشل: '+r.e)}
function setPerm(k,v){db.set.cperm[k]=v?1:0;save();toast('تم حفظ الصلاحيات')}
function chPw(){
 const u=$('#pu').value,a=$('#pa').value,p=$('#pn').value;
 if(db.users.admin!==H(a))return toast('كلمة مرور المدير الحالية غير صحيحة');
 if(p.length<4)return toast('كلمة المرور 4 أحرف على الأقل');if(p!==$('#pn2').value)return toast('كلمتا المرور غير متطابقتين');
 db.users[u]=H(p);save();hint();toast('تم تغيير كلمة المرور');vSet()}
function exp(){
 const b=new Blob([JSON.stringify(db)],{type:'application/json'}),l=document.createElement('a');
 l.href=URL.createObjectURL(b);l.download='sales-backup-'+dk(new Date())+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),1000)}
function imp(){
 const f=$('#imf').files[0];if(!f)return toast('اختر ملف النسخة الاحتياطية');
 const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.products)||!d.users)throw 0;
  if(!confirm('سيتم استبدال كل البيانات الحالية. متابعة؟'))return;load(d);save();ci=0;toast('تم استيراد النسخة الاحتياطية');nav()}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}

document.addEventListener('keydown',e=>{if(!user||e.ctrlKey||e.altKey||e.metaKey||!$('#modal').hidden)return;if(e.key==='Escape')return closeM();if(e.key==='ArrowDown'||e.key==='ArrowUp'){const a=[...document.querySelectorAll('#plist .pc:not(.out)')];if(!a.length)return;const i=a.indexOf(document.activeElement),j=e.key==='ArrowDown'?Math.min(a.length-1,i+1):Math.max(0,i-1);a[j<0?0:j].focus();e.preventDefault()}if(e.key==='Enter'&&document.activeElement?.classList.contains('pc')){document.activeElement.click();e.preventDefault()}});
const BOOT=boot();
</script>
